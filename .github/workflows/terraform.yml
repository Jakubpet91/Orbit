name: 'Terraform CI/CD'

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do? (apply / destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'main_infrastructure/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'main_infrastructure/**'
      - '.github/workflows/terraform.yml'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./main_infrastructure/env/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.1.7

      - name: Terraform Init
        id: init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: terraform init -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" -backend-config="key=dev.tfstate"

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: terraform plan -var="db_administrator_login=${{ secrets.DB_ADMIN_LOGIN }}" -var="db_administrator_password=${{ secrets.DB_ADMIN_PASSWORD }}" -out=tfplan -input=false

      - name: Terraform Apply
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: terraform apply -auto-approve -var="db_administrator_login=${{ secrets.DB_ADMIN_LOGIN }}" -var="db_administrator_password=${{ secrets.DB_ADMIN_PASSWORD }}" -input=false

      - name: Terraform Destroy
#        if: github.event.inputs.action == 'destroy'
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: terraform destroy -auto-approve -var="db_administrator_login=${{ secrets.DB_ADMIN_LOGIN }}" -var="db_administrator_password=${{ secrets.DB_ADMIN_PASSWORD }}"