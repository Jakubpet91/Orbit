name: Test Azure OIDC Login

# Umožní spustit pipeline ručně na kliknutí z GitHub rozhraní
on:
  workflow_dispatch:

# TOTO JE KRITICKÉ PRO OIDC! 
# Bez tohoto bloku GitHub nedostane token pro Azure.

permissions:
  id-token: write

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
      - name: Bezheslové přihlášení do Azure
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}" \
            --federated-token "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Testovací AZ CLI příkaz
        run: |
          echo "Přihlášení ok!"
          az account show

