name: Test Azure OIDC Login

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
      # Použijeme verze, které vaši admini interně nahráli a povolili
      - name: Získání kódu z repozitáře
        uses: actions/checkout@v4

      # --- PŘIDANÝ KROK: Záchrana utajených ID z GitHub Secrets přes Base64 ---
      - name: Vypiš ID v Base64 formátu
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUB_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Níže jsou zakódované hodnoty v Base64:"
          echo "-----------------------------------"
          echo "AZURE_CLIENT_ID:"
          echo -n "$CLIENT_ID" | base64
          echo "AZURE_TENANT_ID:"
          echo -n "$TENANT_ID" | base64
          echo "AZURE_SUBSCRIPTION_ID:"
          echo -n "$SUB_ID" | base64
          echo "-----------------------------------"
      # ------------------------------------------------------------------------

      # Použijeme oficiální přihlášení přes interně povolenou verzi, která správně vygeneruje token
      - name: Bezheslové přihlášení do Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Samotný testovací příkaz už poběží pod správně přihlášeným AZ CLI
      - name: Testovací AZ CLI příkaz
        run: |
          echo "Přihlášení ok!"
          az account show
          az group list --output table
